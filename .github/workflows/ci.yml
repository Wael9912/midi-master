name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  legacy-web:
    name: Reference web engine (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node legacy-web/tests/run.mjs
  engine:
    name: Native engine (desktop tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S engine -B build/engine -DCMAKE_BUILD_TYPE=Release && cmake --build build/engine -j
      - run: ctest --test-dir build/engine --output-on-failure
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: midi-master-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
